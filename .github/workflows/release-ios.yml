name: Release iOS

# One tag ships the build. Runs entirely on the self-hosted Mac Mini: the Unity
# licence is activated locally, so there is no UNITY_LICENSE secret and no
# activate/return cycle to get wrong.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      storeshots:
        description: Store shots - iOS Simulator app with StoreShotDirector (Prompts/34), no TestFlight
        type: boolean
        default: false

# One group PER platform, not one shared "unity-build". GitHub keeps at most
# one *pending* run per group, so when a tag push queued both mobile jobs
# while the previous tag's iOS job still held the shared group, one of the
# two new runs was cancelled after 1 s (v2.6.2 iOS, 2026-09-04).
#
# The shared group used to exist so two editors never wrote the one Library/
# folder at once. That is still guaranteed: the Mac Mini has a single runner
# registration, and a runner executes one job at a time, so iOS and Android
# serialize on the runner instead of on a group that also cancels runs.
concurrency:
  # Store-shot runs get their own group so they never cancel a pending release
  # (and the reverse); the single runner still serializes them.
  group: ${{ inputs.storeshots && 'unity-storeshots-ios' || 'unity-build-ios' }}
  cancel-in-progress: false

env:
  BUNDLE_ID_IOS: com.ol1n.doodlebugsRevival   # must match ProjectSettings → applicationIdentifier.iPhone

jobs:
  ios:
    name: Build & TestFlight
    if: ${{ !inputs.storeshots }}
    runs-on: [self-hosted, macos-unity]
    timeout-minutes: 180

    env:
      UNITY_LIBRARY_PER_TARGET: "1"   # ci/unity-build.sh: one Library per target
      # fastlane asks xcodebuild for the build settings of the Unity project
      # (~3000 files); with the default 3 s timeout it gave up on a busy runner.
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "60"
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
      IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        # The runner's global git config sets core.hooksPath to a hook
        # dispatcher (added on the M2 after v2.9.3), and `git lfs install
        # --local` inside checkout refuses to touch its pre-push hook:
        # "Hook already exists: pre-push". Point hooksPath back at the
        # repo's own .git/hooks for this step only; the machine's global
        # config stays as it is.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: .git/hooks
        with:
          lfs: true
          # clean:false keeps the gitignored Library/ folder between runs. The
          # default would git clean -ffdx it away and add ~10 min of reimport to
          # every build for no benefit — this is why the project is not cached
          # with actions/cache either.
          clean: false

      - name: Compute version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Handles both v1.2.3 and the repo's prefixed forms (beta/1.2.3).
            VERSION="${GITHUB_REF_NAME##*/}"
            VERSION="${VERSION#v}"
          else
            VERSION="$(awk '/^  bundleVersion:/ {print $2}' ProjectSettings/ProjectSettings.asset)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "building version $VERSION build ${GITHUB_RUN_NUMBER}"

      # Everything cheap that can fail runs before the ~30 minute Unity step, so a
      # bad secret or a broken Gemfile surfaces in the first minute.
      - name: Select Ruby
        run: ./ci/select-ruby.sh

      - name: Install fastlane
        run: |
          ruby --version
          bundle config set --local path vendor/bundle
          bundle install --jobs 4

      - name: Prepare signing keychain
        run: ./ci/unlock-keychain.sh

      - name: Install provisioning profile
        run: ./ci/install-profile.sh

      - name: Build Xcode project
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: ./ci/unity-build.sh ios Builds/iOS

      # The Unity build can run for over an hour without touching the
      # keychain; unlock it again so codesign finds it open.
      - name: Unlock signing keychain again
        run: ./ci/unlock-keychain.sh --unlock-only

      - name: Archive, export and upload to TestFlight
        run: bundle exec fastlane ios ios_beta

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: doodlebugs-ios
          path: Builds/ipa/doodlebugs.ipa
          if-no-files-found: warn
          retention-days: 7

      - name: Remove signing material
        if: always()
        run: ./ci/lock-keychain.sh

  # workflow_dispatch with storeshots=true: the unsigned iOS Simulator app for
  # tools/store/shoot_simulator.sh (SKIP_UNITY=1 after unzipping it into
  # Builds/iOS-shots-dd/Build/Products/Release-iphonesimulator/).
  storeshots:
    name: Store shots simulator app
    if: ${{ inputs.storeshots }}
    runs-on: [self-hosted, macos-unity]
    timeout-minutes: 180
    env:
      UNITY_LIBRARY_PER_TARGET: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: .git/hooks
        with:
          lfs: true
          clean: false

      - name: Export simulator Xcode project
        run: ./ci/unity-build.sh ios-storeshots Builds/iOS-shots

      - name: Build simulator app
        run: |
          rm -rf Builds/iOS-shots-dd Builds/storeshots-sim.zip
          xcodebuild -project Builds/iOS-shots/Unity-iPhone.xcodeproj -scheme Unity-iPhone \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath Builds/iOS-shots-dd CODE_SIGNING_ALLOWED=NO -quiet build
          APP="$(find Builds/iOS-shots-dd/Build/Products -maxdepth 2 -name '*.app' -type d | head -1)"
          [[ -n "$APP" ]] || { echo "no simulator .app" >&2; exit 1; }
          ditto -c -k --keepParent "$APP" Builds/storeshots-sim.zip
          ls -lh Builds/storeshots-sim.zip

      - name: Upload simulator app
        uses: actions/upload-artifact@v6
        with:
          name: doodlebugs-storeshots-sim
          path: Builds/storeshots-sim.zip
          retention-days: 7

      - name: Free disk
        if: always()
        run: rm -rf Builds/iOS-shots Builds/iOS-shots-dd Builds/storeshots-sim.zip
