name: Release

# Triggered when a tag is pushed matching any of these patterns:
#   v1.2.3          → full release
#   v1.2.3-beta.1   → pre-release
#   release/1.2.3   → full release
#   alpha/1.2.3     → pre-release
#   beta/1.2.3      → pre-release
on:
  push:
    tags:
      - 'v[0-9]*'
      - 'release/**'
      - 'alpha/**'
      - 'beta/**'

# Required secrets (Settings → Secrets and variables → Actions):
#
# Unity (required for all builds):
#   UNITY_LICENSE   – XML content of the Unity license file
#   UNITY_EMAIL     – Unity account e-mail
#   UNITY_PASSWORD  – Unity account password
#
# To obtain UNITY_LICENSE:
#   1. Run the workflow at https://game.ci/docs/github/activation
#      (game-ci/unity-request-activation-file) and download the .alf file.
#   2. Upload it at https://license.unity3d.com and download the .ulf file.
#   3. Paste the .ulf file contents into the UNITY_LICENSE secret.
#
# Android signing (required for Google Play):
#   ANDROID_KEYSTORE_BASE64    – base64-encoded upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  – keystore password
#   ANDROID_KEY_ALIAS          – key alias inside the keystore
#   ANDROID_KEY_PASSWORD       – key password
#
# iOS signing + TestFlight (required for App Store / TestFlight):
#   IOS_P12_BASE64                  – base64-encoded distribution certificate (.p12)
#   IOS_P12_PASSWORD                – P12 password
#   IOS_KEYCHAIN_PASSWORD           – ephemeral keychain password (any string)
#   IOS_TEAM_ID                     – Apple Developer Team ID
#   IOS_PROVISION_PROFILE_BASE64    – base64-encoded App Store provisioning profile
#   APPSTORE_API_KEY_ID             – App Store Connect API key ID
#   APPSTORE_ISSUER_ID              – App Store Connect issuer ID
#   APPSTORE_API_PRIVATE_KEY        – App Store Connect API private key (.p8 contents)
#
# Use Distribution/scripts/setup-gh-secrets.sh to populate all secrets automatically.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false        # never cancel a running release

env:
  UNITY_VERSION: 6000.3.13f1
  BUILDS_PATH: build
  # game-ci/unity-builder@v4 uses Node.js 20, which GitHub deprecated in Sept 2025.
  # This flag keeps the action running while a Node.js 24 build is not yet available.
  # The deprecation WARNING will still appear in logs — that is expected and harmless.
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  BUNDLE_ID_IOS: com.ol1n.doodlebugsRevival   # must match Unity Player Settings → iOS Bundle Identifier

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # Desktop builds (Windows, Linux, macOS) + Android
  # game-ci runs Unity inside a Docker container on the ubuntu runner,
  # so a single runner type handles all four platforms.
  # ──────────────────────────────────────────────────────────────────────────
  build-cross:
    name: Build / ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: StandaloneWindows64
            artifactName: doodlebugs-windows-x64
            ext: .zip
          - targetPlatform: StandaloneLinux64
            artifactName: doodlebugs-linux-x64
            ext: .tar.gz
          - targetPlatform: StandaloneOSX
            artifactName: doodlebugs-macos
            ext: .zip
          - targetPlatform: Android
            artifactName: doodlebugs-android
            ext: .apk

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history needed for version detection
          lfs: true

      # The Library folder caches imported assets; skipping it costs ~10 min.
      - name: Cache Unity Library
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Compute version from tag
        id: version
        shell: bash
        run: |
          # Strip slash-prefixes (alpha/, beta/, release/) and a leading v so that
          # tags like "alpha/0.0.6" or "v1.2.3" both yield a plain semver string.
          TAG="${{ github.ref_name }}"
          VERSION="${TAG##*/}"   # drop everything up to and including the last /
          VERSION="${VERSION#v}" # drop a leading v if present
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build – ${{ matrix.targetPlatform }}
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: ${{ matrix.artifactName }}
          buildsPath: ${{ env.BUILDS_PATH }}
          versioning: Custom
          version: ${{ steps.version.outputs.version }}

      # ── Package each platform into a single distributable file ────────────

      - name: Package – Windows
        if: matrix.targetPlatform == 'StandaloneWindows64'
        run: |
          cd "${{ env.BUILDS_PATH }}/StandaloneWindows64"
          zip -r "../../${{ matrix.artifactName }}.zip" .

      - name: Package – Linux
        if: matrix.targetPlatform == 'StandaloneLinux64'
        run: |
          # tar preserves the executable bit on the Linux binary
          cd "${{ env.BUILDS_PATH }}/StandaloneLinux64"
          tar -czf "../../${{ matrix.artifactName }}.tar.gz" .

      - name: Package – macOS
        if: matrix.targetPlatform == 'StandaloneOSX'
        run: |
          cd "${{ env.BUILDS_PATH }}/StandaloneOSX"
          zip -r "../../${{ matrix.artifactName }}.zip" .

      - name: Sign & Package – Android APK
        if: matrix.targetPlatform == 'Android'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK=$(find "${{ env.BUILDS_PATH }}/Android" -name "*.apk" | head -1)
          echo -n "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode --ignore-garbage > /tmp/release.keystore
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner sign \
            --ks /tmp/release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "${{ matrix.artifactName }}.apk" \
            "$APK"
          rm /tmp/release.keystore

      - name: Upload to Firebase App Distribution
        if: matrix.targetPlatform == 'Android'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          groups: testers
          releaseNotes: "Doodlebugs Revival ${{ github.ref_name }} (build ${{ github.run_number }})"
          file: ${{ matrix.artifactName }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ matrix.artifactName }}${{ matrix.ext }}
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # iOS build → signed IPA → TestFlight
  # Unity → Xcode project; xcodebuild → signed .ipa via App Store export.
  # Requires: IOS_P12_BASE64, IOS_P12_PASSWORD, IOS_KEYCHAIN_PASSWORD,
  #           IOS_TEAM_ID, IOS_PROVISION_PROFILE_BASE64,
  #           APPSTORE_API_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_API_PRIVATE_KEY
  # ──────────────────────────────────────────────────────────────────────────
  build-ios:
    name: Build / iOS
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-
            Library-

      - name: Compute version from tag
        id: version
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG##*/}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build iOS Xcode project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          buildName: doodlebugs-ios
          buildsPath: ${{ env.BUILDS_PATH }}
          versioning: Custom
          version: ${{ steps.version.outputs.version }}

      - name: Import signing certificate
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          echo -n "$IOS_P12_BASE64" | base64 --decode > signing.p12
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" build.keychain
          security import signing.p12 -k build.keychain -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$IOS_KEYCHAIN_PASSWORD" build.keychain
          rm signing.p12

      - name: Install provisioning profile
        env:
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          DECODED=$(security cms -D -i profile.mobileprovision)
          PROFILE_UUID=$(echo "$DECODED" | plutil -extract UUID raw -)
          PROFILE_NAME=$(echo "$DECODED" | plutil -extract Name raw -)
          PROFILE_TEAM_ID=$(echo "$DECODED" | plutil -extract TeamIdentifier.0 raw -)
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "PROFILE_TEAM_ID=$PROFILE_TEAM_ID" >> $GITHUB_ENV
          rm profile.mobileprovision

      - name: Archive iOS app
        run: |
          XCODE_PROJECT="${{ env.BUILDS_PATH }}/iOS/doodlebugs-ios/Unity-iPhone.xcodeproj"
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "Unity-iPhone" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "${{ env.BUILDS_PATH }}/doodlebugs.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            DEVELOPMENT_TEAM="$PROFILE_TEAM_ID"

      - name: Export signed IPA
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${PROFILE_TEAM_ID}</string>
              <key>compileBitcode</key>
              <false/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${{ env.BUNDLE_ID_IOS }}</key>
                  <string>${{ env.PROFILE_NAME }}</string>
              </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "${{ env.BUILDS_PATH }}/doodlebugs.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath ipa_output
          cp ipa_output/*.ipa doodlebugs-ios.ipa

      - name: Upload to TestFlight
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_API_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8
          xcrun altool --upload-app \
            --type ios \
            --file doodlebugs-ios.ipa \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
          rm -f ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8

      - name: Clean up keychain
        if: always()
        run: security delete-keychain build.keychain 2>/dev/null || true

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: doodlebugs-ios
          path: doodlebugs-ios.ipa
          if-no-files-found: warn
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Create the GitHub Release and attach every build artifact
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-cross, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create releases and upload assets

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true   # flatten into a single directory

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Determine release type
        id: meta
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == alpha/* || "$TAG" == *"-alpha"* || "$TAG" == *".alpha"* ]]; then
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
            echo "label=Alpha"     >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == beta/* || "$TAG" == *"-beta"* || "$TAG" == *".beta"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "label=Beta"      >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == release/* ]]; then
            echo "prerelease=false"   >> "$GITHUB_OUTPUT"
            echo "label=Release"      >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false"   >> "$GITHUB_OUTPUT"
            echo "label=Release"      >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Doodlebugs Revival ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true   # auto-generates changelog from commits/PRs
          files: artifacts/**/*
          body: |
            ## Doodlebugs Revival — ${{ steps.meta.outputs.label }} `${{ github.ref_name }}`

            ### Downloads

            | Platform | File |
            |----------|------|
            | Windows (x64) | `doodlebugs-windows-x64.zip` |
            | Linux (x64) | `doodlebugs-linux-x64.tar.gz` |
            | macOS | `doodlebugs-macos.zip` |
            | Android | `doodlebugs-android.apk` |
            | iOS | `doodlebugs-ios.ipa` (also uploaded to TestFlight) |

            > **Android:** Enable *Install from unknown sources* before installing the APK.

            ---
