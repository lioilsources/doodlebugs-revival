name: Unity – Request Activation File

# Run this workflow ONCE to obtain the UNITY_LICENSE secret.
# After that you never need to run it again (unless the license expires).
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  HOW TO USE                                                             │
# ├─────────────────────────────────────────────────────────────────────────┤
# │  1. GitHub → Actions → "Unity – Request Activation File" → Run workflow │
# │  2. Wait for the job to finish, then download the artifact              │
# │     "Unity_v6000.3.13f1_...alf"                                        │
# │  3. Open https://license.unity3d.com/manual                            │
# │     Upload the .alf file → download the returned .ulf file             │
# │  4. GitHub → Settings → Secrets and variables → Actions                │
# │     Add/update these three secrets:                                     │
# │       UNITY_LICENSE  ← paste the full contents of the .ulf file        │
# │       UNITY_EMAIL    ← your Unity account e-mail                       │
# │       UNITY_PASSWORD ← your Unity account password                     │
# │  5. The release.yml workflow can now build successfully.                │
# └─────────────────────────────────────────────────────────────────────────┘
#
# ALTERNATIVE — create the .alf locally (faster, no Docker pull):
#   /Applications/Unity/Hub/Editor/6000.3.13f1/Unity.app/Contents/MacOS/Unity \
#     -quit -nographics -batchmode \
#     -createManualActivationFile \
#     -logfile /tmp/unity-activation.log
#   → .alf file appears in current directory

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request manual activation file
    runs-on: ubuntu-latest

    steps:
      - name: Generate .alf activation file via Unity Docker
        run: |
          docker run --rm \
            -v "$(pwd)":/project \
            unityci/editor:ubuntu-6000.3.13f1-base-3 \
            unity-editor \
              -batchmode -nographics -quit \
              -createManualActivationFile \
              -logfile /dev/stdout \
            || true
          ALF=$(ls Unity_v*.alf 2>/dev/null | head -1)
          if [[ -z "$ALF" ]]; then
            echo "ERROR: No .alf file generated. Check logs above."
            exit 1
          fi
          echo "Generated: $ALF"

      - name: Upload .alf as artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: Unity_v*.alf
          retention-days: 1
